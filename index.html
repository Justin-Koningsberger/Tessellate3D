<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tessellate3D</title>
  <style>
    body { margin: 0; padding: 0; background: #111116; color: #fff; font-family: system-ui, sans-serif; }
    .studio-container { display: grid; grid-template-columns: minmax(280px, 22vw) 1fr; height: 100vh; }

    .controls-panel {
      background: #191921; padding: 16px; border-right: 1px solid #2d2d3a;
      overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    }

    h2 { margin: 0 0 8px 0; font-size: 18px; color: #38bdf8; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #cbd5e1; }
    .row { flex-direction: row; align-items: center; gap: 10px; margin: 4px 0; }

    input, select {
      background: #0f0f13; color: #fff; padding: 8px;
      border: 1px solid #3f3f46; border-radius: 6px; font-family: inherit;
    }
    input[type="range"] { padding: 0; cursor: pointer; }
    hr { border: 0; border-top: 1px solid #2d2d3a; margin: 8px 0; }

    .canvas-viewport { background: #09090b; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #svg-injection-target {
      width: 100%; max-width: 750px; background: #fff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden;
    }
    #svg-injection-target svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>

  <main class="studio-container">
    <!-- Left Hand Parameter Controls Panel -->
    <section class="controls-panel" id="controls">
      <h2>🌀 Tessellate3D</h2>

      <label>
        <span>Transform Variant Mode</span>
        <select id="variantMode">
          <option value="logarithmic">Logarithmic Spiral</option>
          <option value="loxodromic" selected>Loxodromic Twist</option>
          <option value="single-pole">Single-Pole Decay</option>
          <option value="multi-pole">Multi-Pole Hyperbolic</option>
        </select>
      </label>

      <label>
        <span>Base Motif Geometry</span>
        <select id="baseMotif">
          <option value="chevron">Chevron</option>
          <option value="chevron2">Chevron 2 (Sharp Interlock)</option>
          <option value="square">Square</option>
          <option value="detailedSquare">Detailed Square</option>
          <option value="sinewave">Sine Wavelet</option>
          <option value="squarewave" selected>Square Wave / Battlement</option>
          <option value="puzzle">Jigsaw Puzzle Tab</option>
        </select>
      </label>

      <label class="row">
        <input type="checkbox" id="useInverseDebugging" />
        <span>Enable Inverse Grid Lines</span>
      </label>
      <hr />

      <label>
        <span>Symmetry Arms / Branches: <span id="totalBranches-val">4</span></span>
        <input type="range" id="totalBranches" min="2" max="33" value="4" />
      </label>

      <label>
        <span>Concentric Rings Depth: <span id="maxRings-val">6</span></span>
        <input type="range" id="maxRings" min="1" max="30" value="6" />
      </label>

      <label>
        <!-- 2*Pi Radians tracks a complete 360-degree circular coordinate rotation -->
        <span>Camera Rotation: <span id="globalRotation-val">0</span> rad</span>
        <input type="range" id="globalRotation" min="0" max="6.28" step="0.01" value="0" />
      </label>

      <label id="decayContainer">
        <span>Inward Scale Decay Multiplier: <span id="decayMultiplier-val">0.35</span></span>
        <input type="range" id="decayMultiplier" min="0.1" max="2.0" step="0.01" value="0.35" />
      </label>

      <label id="twistContainer">
        <span>Loxodromic Twist Torsion: <span id="twistFactor-val">0.45</span></span>
        <input type="range" id="twistFactor" min="-2.0" max="2.0" step="0.01" value="0.45" />
      </label>

      <label>
        <span>Concentric Stagger Factor: <span id="staggerFactor-val">0.0</span></span>
        <input type="range" id="staggerFactor" min="0" max="1" step="1" value="0" />
      </label>
      <hr />

      <label>
        <span>Palette</span>
      </label>

      <label class="row">
        <input type="checkbox" id="applyStroke" />
        <span>Apply stroke</span>
      </label>
      <!-- The dynamic color item list slots will be mounted inside this div -->
      <div id="palette-list-container" style="display: flex; flex-direction: column; gap: 8px; margin: 4px 0;"></div>
      <button id="btn-add-color" type="button" style="background: #10b981; color: white; padding: 6px; border: none; border-radius: 4px; margin-top: 4px; cursor: pointer;">➕ Add color</button>
    </section>

    <!-- Right Hand Interactive Graphic Viewport Canvas Section -->
    <section class="canvas-viewport" style="display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; padding: 20px;">

      <!-- Render Output Screen Target Element Block -->
      <div id="svg-injection-target"></div>

      <!-- Action Utility Export Floating Control Panel Row -->
      <div id="canvas-export-controls" style="display: flex; gap: 12px; margin-top: 4px;">
        <button id="btn-download-master" type="button" style="background: #2563eb; color: white; padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">🖼️ Export Master SVG</button>
        <button id="btn-download-separated" type="button" style="background: #7c3aed; color: white; padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">🎨 Export Separated Colors</button>
      </div>
    </section>
  </main>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
